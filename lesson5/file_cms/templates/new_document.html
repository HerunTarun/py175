{% extends 'layout.html' %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}
{% with messages = get_flashed_messages(with_categories=True) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">
        <p>{{ message }}</p>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
<form action=" {{ url_for('create_document') }}" method="post">
  <label for="document_name">add a new document:</label>
  <div>
    <input name="document_name" type="text">
    <button type="submit">create</button>
  </div>
</form>
{% endblock %}
