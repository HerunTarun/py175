{% extends 'layout.html' %}

{% block content %}
{% with messages = get_flashed_messages(with_categories=True) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">
        <p>{{ message }}</p>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
<form action="{{ url_for('log_in') }}" method="post">
  <div>
    <label class="login" for="username">username:</label>
    <input name="username" type="text" value="{{ username if username is defined else '' }}">
  </div>
  <div>
    <label class="login" for="password">password: </label>
    <input name="password" type="text">
  </div>
  <button type="submit">Log In</button>
</form>
{% endblock %}
