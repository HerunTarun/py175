{% extends 'layout.html' %}

{% block title %}
  Edit Document
{% endblock %}

{% block content %}
  <form action="{{ url_for('update_document', file_name=file_name)}}" method="post">
    <label for="content">Edit content of {{ file_name }}:</label>
    <div>
      <textarea name="contents" id="content" rows="20" cols="100">{{ contents }}</textarea>
    </div>
      <button type="submit">Save Changes</button>
  </form>
{% endblock %}
