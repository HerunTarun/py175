{% extends 'layout.html' %}

{% block content %}
  <section id="todos">
    <header>
      <h2>{{ list.title }}</h2>
      <ul>
        <li>
          <form class="complete_all"
                action="/lists/{{ list.id }}/complete_all"
                method="post">
            <button class="check" type="submit">Complete All</button>
          </form>
        </li>
        <li>
          <a class="edit" href="/lists/{{ list.id }}/edit">Edit List</a>
        </li>
      </ul>
    </header>
    <ul>
      {% for todo in list.todos %}
      <li class="{{'complete' if todo.completed else ''}}">
        <form action="/lists/{{ lists.id }}/todos/{{ todo.id }}/toggle"
              method="post"
              class="check">
          <input type="hidden" name="completed"
                value="{{ not todo.completed }}">
          <button type="submit">Complete</button>
        </form>
        <h3>{{ todo['title']}}</h3>
        <form class="delete"
              action="/lists/{{ list.id }}/todos/{{ todo.id}}/delete"
              method="post">
          <button type="submit">Delete</button>
        </form>
      </li>
      {% endfor %}
    </ul>

  </section>

  <form action="/lists/{{ list.id }}/todos" method="post">
    <dl>
      <dt>
        <label for="todo">Enter a new todo item:</label>
      </dt>
      <dd>
        <input name="todo" id="todo" placeholder="Something to do" type="text"
                value="{{ request.form['todo'] }}">
      </dd>
    </dl>
    <fieldset class="actions">
      <input type="submit" value="Add">
    </fieldset>
  </form>
{% endblock %}

{% block header_links%}
  <a class="list" href="{{ url_for('get_lists') }}">All Lists</a>
{% endblock%}
