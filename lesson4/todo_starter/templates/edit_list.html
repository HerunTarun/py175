{% extends 'layout.html' %}

{% block content %}
  <section id="todos">
    <header>
      <h2>Editing '{{ list.title }}'</h2>
        <ul>
          <li>
            <form class="delete"
                  action="{{ url_for('delete_list', list_id=list.id) }}"
                  method="post">
              <button type="submit" class="delete">Delete List</button>
            </form>
          </li>
        </ul>
    </header>
  </section>
  <form action="{{ url_for('update_list_name', list_id=list.id) }}" method="post">
    <dl>
      <dt>
        <label for="list_title">Enter the new list title</label>
      </dt>
      <dd>
        <input name="list_title" type="text" placeholder="List Title" value="{{ title if title is defined else list.title }}">
      </dd>
    </dl>
    <fieldset class="actions">
      <input type="submit" value="Save">
      <a href="{{ url_for('display_todo_list', list_id=list.id) }}">Cancel</a>
    </fieldset>
  </form>
{% endblock %}
